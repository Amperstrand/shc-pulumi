name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install shc-toolkit from git
        run: pip install git+https://github.com/Amperstrand/shc-toolkit.git

      - name: Install shc-pulumi (editable) + pytest
        run: |
          pip install -e .
          pip install pytest

      - name: Run unit tests
        run: python3 -m pytest tests/ -v

  import-test:
    name: Import test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install shc-toolkit (dependency)
        run: pip install git+https://github.com/Amperstrand/shc-toolkit.git

      - name: Install shc-pulumi (editable)
        run: pip install -e .

      - name: Ensure Pulumi is available
        run: pip install pulumi

      - name: Verify import
        run: python -c "from shc_pulumi import SHCVMResource; print('OK')"

  lint:
    name: Byte-compile lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile-check source
        run: python -m py_compile src/shc_pulumi/*.py

  size-map-drift:
    name: Size map drift detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compare Pulumi SIZE_MAP against shc-toolkit
        run: |
          pip install git+https://github.com/Amperstrand/shc-toolkit.git -q
          pip install -e . -q
          python3 -c "
          import sys
          from shc_pulumi.sizes import SIZE_MAP as pulumi_map
          from shc_toolkit.sizes import SIZE_MAP as toolkit_map

          print(f'Pulumi SIZE_MAP: {len(pulumi_map)} entries')
          print(f'Toolkit SIZE_MAP: {len(toolkit_map)} entries')

          errors = []
          for name, entry in pulumi_map.items():
              tk = toolkit_map.get(name)
              if not tk:
                  errors.append(f'{name}: in Pulumi but not in toolkit')
              elif entry['package_id'] != tk['package_id']:
                  errors.append(f'{name}: package_id {entry[\"package_id\"]} != toolkit {tk[\"package_id\"]}')
              elif entry.get('pricing_id') != tk.get('pricing_id') and entry.get('pricing_id'):
                  tk_pricing = tk.get('pricing_id') or _lookup_pricing(tk['package_id'])
                  if tk_pricing and entry['pricing_id'] != tk_pricing:
                      errors.append(f'{name}: pricing_id mismatch')

          missing = set(toolkit_map) - set(pulumi_map)
          if missing:
              print(f'::warning::Toolkit has {len(missing)} sizes not in Pulumi: {sorted(missing)[:5]}...')

          if errors:
              for e in errors:
                  print(f'::error::{e}')
              sys.exit(1)
          print('Size maps match ✅')
          "
