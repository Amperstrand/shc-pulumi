name: Integration

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'yes' to run -- this provisions and cancels a real VM"
        required: true
        default: "yes"

jobs:
  integration:
    name: Provider VM lifecycle (create + cancel)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SHC_API_KEY: ${{ secrets.SHC_API_KEY }}
      SHC_PKG_ID: "81"
      SHC_PRICING_ID: "245"
    steps:
      - name: Abort without API key
        run: |
          if [ -z "$SHC_API_KEY" ]; then
            echo "::error::SHC_API_KEY secret is required"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install git+https://github.com/Amperstrand/shc-toolkit.git
          pip install -e .

      - name: Run provider lifecycle test
        id: lifecycle
        run: |
          python3 << 'PYEOF'
          import os, time, json, requests
          from shc_pulumi.provider import SHCVMProvider

          api_key = os.environ["SHC_API_KEY"]
          base = "https://blesta.sovereignhybridcompute.com/user-api/v2"

          def get_balance():
              r = requests.get(f"{base}/billing/balance",
                  headers={"Authorization": f"Bearer {api_key}"}, timeout=15)
              t = r.text
              i = t.find("{")
              if i > 0: t = t[i:]
              d = json.loads(t).get("data", {})
              for b in d.get("balances", []):
                  if b.get("currency") == "USD":
                      return float(b["available_credit"])
              return 0.0

          before = get_balance()
          hostname = f"ci-pulumi-{int(time.time())}"
          pkg_id = int(os.environ["SHC_PKG_ID"])
          pricing_id = int(os.environ["SHC_PRICING_ID"])
          print(f"[1/4] Creating VM '{hostname}' (pkg {pkg_id}, pricing {pricing_id})...")
          print(f"      Provisioning can take up to 15 minutes on SHC...")
          p = SHCVMProvider()
          result = p.create({"hostname": hostname, "package_id": pkg_id,
              "pricing_id": pricing_id, "api_key": api_key, "auto_cancel": True})
          sid = result.id
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"SHC_CREATED_SID={sid}\n")
              f.write(f"SHC_HOSTNAME={hostname}\n")
          outs = result.outs
          print(f"  OK: id={sid} ip={outs.get('ip','')} status={outs.get('status','')}")

          print("[2/4] Reading VM...")
          r = p.read(sid, outs)
          print(f"  OK: ip={r.outs.get('ip','')} status={r.outs.get('status','')}")

          print("[3/4] Diff (no changes)...")
          d = p.diff(sid, outs, {**outs, "api_key": api_key})
          print(f"  changes={d.changes}")

          print("[4/4] Canceling VM...")
          p.delete(sid, outs)
          print("  OK: canceled")

          time.sleep(5)
          after = get_balance()
          cost = before - after
          print(f"\nCI run cost: ${cost:.2f}")
          if cost > 1.0:
              print("WARNING: cost above $1 -- check for leftover VMs")
          PYEOF

      - name: Always cancel VM (even on failure)
        if: always() && env.SHC_CREATED_SID != ''
        run: |
          python3 << 'PYEOF'
          import os, requests
          api_key = os.environ.get("SHC_API_KEY", "")
          base = "https://blesta.sovereignhybridcompute.com/user-api/v2"
          sid = os.environ.get("SHC_CREATED_SID", "")
          if not sid:
              print("No VM was created; nothing to cancel.")
              raise SystemExit(0)
          h = {"Authorization": f"Bearer {api_key}"}
          print(f"Always-cancel: canceling VM {sid}")
          try:
              r = requests.post(f"{base}/vm/{sid}/cancel",
                  headers=h, json={"immediate": True}, timeout=15)
              print(f"  cancel http={r.status_code}")
          except Exception as e:
              print(f"  cancel error (ignored): {e}")
          PYEOF

      - name: Cleanup orphaned VMs
        if: always()
        run: |
          pip install -q git+https://github.com/Amperstrand/shc-toolkit.git
          python3 -c "
          import os
          from shc_toolkit.client import SHCClient
          c = SHCClient(api_key=os.environ['SHC_API_KEY'])
          orphans = c.reap_orphans(max_age_hours=0.0, dry_run=False)
          print(f'Cleanup: reaped {len(orphans)} orphan(s)')
          for o in orphans:
              print(f'  {o[\"hostname\"]} (ID={o[\"id\"]})')
          "
